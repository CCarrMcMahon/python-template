name: Release

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish release assets
    runs-on: ubuntu-latest

    steps:
      - name: Validate release tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release tag in the form vMAJOR.MINOR.PATCH, got: $TAG_NAME" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.10"

      - name: Install uv
        run: python -m pip install uv==0.11.17

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check

      - name: Run tests
        run: uv run pytest

      - name: Build distributions
        run: uv build

      - name: Extract release notes from changelog
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: python scripts/extract_release_notes.py --tag "$TAG_NAME" --output release-notes.md

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$TAG_NAME" --notes-file release-notes.md
            gh release upload "$TAG_NAME" dist/* --clobber
          else
            gh release create "$TAG_NAME" dist/* --verify-tag --title "$TAG_NAME" --notes-file release-notes.md
          fi
